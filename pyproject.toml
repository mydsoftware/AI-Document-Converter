[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-document-converter"
version = "0.1.0"
description = "مبدل هوشمند همه‌کاره و ماژولار"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0", "PyMuPDF>=1.24"]
ocr = ["pytesseract>=0.3.13", "Pillow>=10.0"]
word = ["python-docx>=1.1"]
dev = ["pytest>=8.0", "pypdf>=5.0"]
full = ["pypdf>=5.0", "PyMuPDF>=1.24", "pytesseract>=0.3.13", "Pillow>=10.0", "python-docx>=1.1"]

[project.scripts]
adc = "ai_document_converter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_document_converter*"]
