name: آزمون ویندوز

on:
  push:
  pull_request:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  windows:
    name: آزمون نصب و CLI ویندوز
    runs-on: windows-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: نصب پروژه و وابستگی‌های کامل
        shell: pwsh
        run: python -m pip install -e ".[full,dev]"
      - name: آزمون‌ها
        shell: pwsh
        run: python -m pytest -q
      - name: آزمون CLI
        shell: pwsh
        run: python -m ai_document_converter.cli system --ai
