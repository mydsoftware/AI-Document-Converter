name: ساخت نصب‌کننده ویندوز

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: نصب وابستگی‌ها
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install -e .
          pip install pyinstaller

      - name: ساخت GUI
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --name AI-Document-Converter-GUI --windowed src/ai_document_converter/gui/app.py

      - name: نصب Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: ساخت Setup.exe
        shell: pwsh
        run: iscc installer/AI-Document-Converter.iss

      - name: انتشار فایل نصب
        uses: actions/upload-artifact@v4
        with:
          name: AI-Document-Converter-Windows-Installer
          path: installer/output/AI-Document-Converter-Setup.exe

      - name: انتشار Release در Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installer/output/AI-Document-Converter-Setup.exe
