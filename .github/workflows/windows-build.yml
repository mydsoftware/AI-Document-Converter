name: ساخت و تست ویندوز

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  windows:
    name: ساخت EXE و نصب‌کننده ویندوز
    runs-on: windows-latest
    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4
      - name: نصب Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: نصب پروژه و ابزارهای ساخت
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller
      - name: اجرای آزمون‌ها
        shell: pwsh
        run: python -m pytest -q
      - name: بررسی CLI
        shell: pwsh
        run: |
          python -m ai_document_converter.cli system --ai
          python -m ai_document_converter.cli --help
      - name: بررسی GUI
        shell: pwsh
        run: python -c "import tkinter; from ai_document_converter.gui.app import ConverterApp; print('GUI OK')"
      - name: ساخت EXE با PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --name AI-Document-Converter-GUI --windowed src/ai_document_converter/gui/app.py
      - name: بررسی EXE
        shell: pwsh
        run: |
          $exe = "dist/AI-Document-Converter-GUI/AI-Document-Converter-GUI.exe"
          if (!(Test-Path $exe)) { throw "فایل اجرایی GUI ساخته نشد: $exe" }
          Write-Host "EXE ساخته شد: $exe"
      - name: نصب Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: ساخت Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/output | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer/AI-Document-Converter.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup با خطا متوقف شد: $LASTEXITCODE" }
          $setup = "installer/output/AI-Document-Converter-Setup.exe"
          if (!(Test-Path $setup)) { throw "Setup.exe ساخته نشد: $setup" }
          Write-Host "نصب‌کننده ساخته شد: $setup"
      - name: بررسی خروجی‌ها
        shell: pwsh
        run: |
          Get-Item "dist/AI-Document-Converter-GUI/AI-Document-Converter-GUI.exe" | Format-List FullName,Length
          Get-Item "installer/output/AI-Document-Converter-Setup.exe" | Format-List FullName,Length
      - name: ذخیره EXE
        uses: actions/upload-artifact@v4
        with:
          name: AI-Document-Converter-GUI-Windows
          path: dist/AI-Document-Converter-GUI/**
          if-no-files-found: error
      - name: ذخیره نصب‌کننده
        uses: actions/upload-artifact@v4
        with:
          name: AI-Document-Converter-Setup-Windows
          path: installer/output/AI-Document-Converter-Setup.exe
          if-no-files-found: error
      - name: تولید گزارش ساخت
        shell: pwsh
        run: |
          @"
          ساخت ویندوز با موفقیت انجام شد.
          EXE: AI-Document-Converter-GUI.exe
          Installer: AI-Document-Converter-Setup.exe
          "@ | Out-File build-result.txt -Encoding utf8
      - name: ذخیره گزارش ساخت
        uses: actions/upload-artifact@v4
        with:
          name: AI-Document-Converter-Build-Report
          path: build-result.txt
          if-no-files-found: error
